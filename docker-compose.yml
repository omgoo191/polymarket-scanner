version: "3.9"

networks:
  radar_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: 111
      POSTGRES_DB: radardb
    volumes:
      - radar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radardb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - radar_net

  radar:
    build: .
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql+asyncpg://radar:111@postgres:5432/radardb
    volumes:
      - ./config/config.yaml:/app/config/config.yaml
    networks:
      - radar_net
volumes:
  radar_pgdata:
