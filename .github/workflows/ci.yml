name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/radar:latest
            ghcr.io/${{ github.repository_owner }}/radar:sha-${{ github.sha }}

      - name: Update image tag in values.yaml
        run: |
          sed -i "s/tag: .*/tag: sha-${{ github.sha }}/" infra/helm/radar/values.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add infra/helm/radar/values.yaml
          git commit -m "ci: update image tag to sha-${{ github.sha }}"
          git push